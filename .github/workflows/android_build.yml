name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Aggressive JCenter Removal
        run: |
          echo "Removing jcenter() from ALL gradle files in the entire workspace..."
          # This searches EVERY folder, including node_modules, for any .gradle file
          find . -type f -name "*.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          find . -type f -name "*.gradle" -exec sed -i 's/jcenter //g' {} +

          echo "Verifying if jcenter still exists..."
          grep -r "jcenter()" . || echo "No more jcenter() calls found!"

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -Pandroid.newDsl=false --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sentra-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
