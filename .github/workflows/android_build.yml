name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Aggressive JCenter and Library Fixes
        run: |
          echo "Removing jcenter() from ALL gradle files..."
          find . -type f -name "*.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          find . -type f -name "*.gradle" -exec sed -i 's/jcenter //g' {} +

          echo "Fixing react-native-foreground-service compilation error..."
          TARGET_FILE="node_modules/react-native-foreground-service/android/src/main/java/com/supersami/foregroundservice/NotificationHelper.java"
          if [ -f "$TARGET_FILE" ]; then
            sed -i 's/R.drawable.redbox_top_border_background/android.R.drawable.ic_dialog_info/g' "$TARGET_FILE"
            echo "Successfully patched NotificationHelper.java"
          fi

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.newDsl=false --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sentra-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
